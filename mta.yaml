_schema-version: 3.3.0
ID: ITSM
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: ITSM-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: ITSM-auth
      - name: ITSM-db

  - name: ITSM-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: ITSM-db

  - name: ITSM-ui
    type: html5
    path: app/webapp
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - mkdir -p dist
        - zip -r dist/itsm.ui.zip . -x "dist/*"
      supported-platforms: []

  - name: ITSM-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: resources
      requires:
        - name: ITSM-ui
          artifacts:
            - itsm.ui.zip
          target-path: resources/
    requires:
      - name: ITSM-auth
      - name: srv-api
      - name: ITSM-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            HTML5.ForwardAuthToken: true
            HTML5.DynamicDestination: true

  - name: ITSM-destinationcontent
    type: com.sap.application.content
    requires:
      - name: ITSM-auth
        parameters:
          service-key:
            name: ITSM-auth-key
      - name: ITSM-html5-repo-host
        parameters:
          service-key:
            name: ITSM-repo-host-key
      - name: ITSM-destination
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          destinations:
            - Name: ITSM-html5-repository
              ServiceInstanceName: ITSM-html5-repo-host
              ServiceKeyName: ITSM-repo-host-key
              sap.cloud.service: ITSM
            - Authentication: OAuth2UserTokenExchange
              Name: ITSM-uaa
              ServiceInstanceName: ITSM-auth
              ServiceKeyName: ITSM-auth-key
              sap.cloud.service: ITSM
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: ITSM-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ITSM-${org}-${space}
        tenant-mode: dedicated
  - name: ITSM-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: ITSM-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: ITSM-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: ITSM-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Name: ITSM-srv
                URL: ~{srv-api/srv-url}
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
              - Name: ui5
                URL: https://ui5.sap.com
                Type: HTTP
                ProxyType: Internet
                Authentication: NoAuthentication
            existing_destinations_policy: update
    requires:
      - name: srv-api